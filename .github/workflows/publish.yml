# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        id: install-uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv --version

      - name: Build package
        run: |
          # Build the package with uv
          uv build
          
          # Verify dist directory contains files
          if [ ! "$(ls -A dist)" ]; then
            echo "Error: No distribution files were created"
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write    # Required for trusted publishing
      contents: read     # Required for checkout

    steps:
      - uses: actions/checkout@v4  # Required for uv publish with custom index

      - name: Install uv
        id: install-uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv --version

      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Verify distributions
        run: |
          # Verify dist directory contains files
          if [ ! "$(ls -A dist)" ]; then
            echo "Error: No distribution files found"
            exit 1
          fi
          echo "Found distribution files:"
          ls -l dist/

      - name: Publish to PyPI
        # GitHub Actions will automatically provide the OIDC token
        # No need to set UV_PUBLISH_TOKEN when using trusted publishing
        run: uv publish 